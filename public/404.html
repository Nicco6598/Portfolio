<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>File not found — Marco Niccolini</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; background: #d3d6ec; color: #0a19a0; font: 14px/1.6 ui-monospace, 'Cascadia Mono', Menlo, monospace; }
      main { box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; min-height: 100%; padding: clamp(16px, 3vw, 40px); }
      h1 { margin: 0; font-size: clamp(56px, 14vw, 200px); font-weight: 700; line-height: 0.9; letter-spacing: -0.04em; }
      p { margin: 20px 0 0; font-size: 16px; }
      a { color: inherit; }
      span { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <span>Error 404</span>
      <div>
        <h1>File not found.</h1>
        <p>Nothing is stored at this address. <a href="/">Back to the menu</a>.</p>
      </div>
    </main>
  </body>
</html>
