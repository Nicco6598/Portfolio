<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Wrong platform — Marco Niccolini</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0a; color: #edebe6; font-family: -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      main { box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; min-height: 100%; padding: clamp(16px, 3vw, 40px); }
      h1 { margin: 0; font-size: clamp(56px, 12vw, 220px); font-weight: 650; line-height: 0.86; letter-spacing: -0.06em; }
      p { margin: 24px 0 0; font-size: clamp(19px, 2vw, 28px); color: #8a8780; letter-spacing: -0.02em; }
      a { color: inherit; font-weight: 500; }
      span { font: 13px ui-monospace, monospace; text-transform: uppercase; color: #8a8780; }
    </style>
  </head>
  <body>
    <main>
      <span>404</span>
      <div>
        <h1>Wrong platform.</h1>
        <p>This train doesn’t stop here. <a href="/">Back to the main line</a>.</p>
      </div>
    </main>
  </body>
</html>
